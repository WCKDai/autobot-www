name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.shots/**'
  pull_request:
  workflow_dispatch:
  # The six-hourly refresh commits with GITHUB_TOKEN, which starts no push workflows;
  # deploy what it baked once it has finished.
  workflow_run:
    workflows: [Refresh releases]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      # Only whether Cloudflare is configured: the credentials reach the deploy step alone, never
      # pnpm install (dependency scripts), the builds or the browser checks.
      CLOUDFLARE_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # On workflow_run, deploy main as the refresh left it, not the commit that started it.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || '' }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh release data and install mirror
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm data
          pnpm sync:install
      - run: pnpm build:all
      - run: node scripts/check-links.mjs
      - run: pnpm omnie:check
      - run: pnpm omnie:browser
      - run: pnpm projects:check
      - run: pnpm projects:browser
      - run: python3 -m unittest discover -s brand -p 'test_*.py'
      - run: node --test scripts/tinyrex-models.test.mjs scripts/browser-tools.test.mjs
      - run: node scripts/tinyrex-browser.mjs
      - run: node scripts/family-browser.mjs

      - name: Deploy the sites
        if: ${{ env.CLOUDFLARE_CONFIGURED == 'true' && github.event_name != 'pull_request' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # autobot.sh, invincible.sh, sovware.io, wckd.ai, nightfall.sh, tinyrex.sh, trigon.sh, the www
        # redirects and polycore.dev. Omnie stays a separate, explicit deploy.
        run: |
          for site in autobot invincible sovware wckd nightfall tinyrex trigon www polycore; do
            echo "::group::$site"
            npx --yes wrangler@4 deploy --config "deploy/$site.wrangler.jsonc"
            echo "::endgroup::"
          done

      - name: Cloudflare is not configured
        if: ${{ env.CLOUDFLARE_CONFIGURED != 'true' }}
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; the sites were built but not deployed."
          echo "Add both repository secrets, or run pnpm deploy locally after 'npx wrangler login'."
